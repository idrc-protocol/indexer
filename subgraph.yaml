specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Hub
    network: base-sepolia
    source:
      address: "0xf2CCA756D7dE98d54ed00697EA8Cf50D71ea0Dd1"
      abi: Hub
      startBlock: 32475130
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Initialized
        - OwnershipTransferred
        - Paused
        - PriceUpdated
        - RequestedRedemption
        - RequestedSubscription
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - Unpaused
        - Upgraded
      abis:
        - name: Hub
          file: ./abis/Hub.json
      eventHandlers:
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Paused(address)
          handler: handlePaused
        - event: PriceUpdated(indexed uint256,uint256)
          handler: handlePriceUpdated
        - event: RequestedRedemption(indexed address,uint256,uint256)
          handler: handleRequestedRedemption
        - event: RequestedSubscription(indexed address,uint256,uint256)
          handler: handleRequestedSubscription
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/hub.ts
  - kind: ethereum
    name: IDRC
    network: base-sepolia
    source:
      address: "0xD3723bD07766d4993FBc936bEA1895227B556ea3"
      abi: IDRC
      startBlock: 32475130
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - BurnedByHub
        - IDRCInitialized
        - MintedByHub
        - IDRCOwnershipTransferred
        - Transfer
        - IDRCUpgraded
      abis:
        - name: IDRC
          file: ./abis/IDRC.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: BurnedByHub(indexed address,uint256)
          handler: handleBurnedByHub
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: MintedByHub(indexed address,uint256)
          handler: handleMintedByHub
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/idrc.ts
